services:
  - type: web
    name: rag-chatboat-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirement.txt
    startCommand: uvicorn api.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: OPENAI_API_KEY
        sync: false
